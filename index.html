
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .background {
      position: fixed;
      inset: 0;
      background: url('./bg.gif') center / cover no-repeat;
    }

    /* Rotate GIF on portrait mobile screens */
    @media (max-width: 768px) and (orientation: portrait) {
      .background {
        inset: auto;
        top: 50%;
        left: 50%;
        width: 100vh;
        height: 100vw;
        transform: translate(-50%, -50%) rotate(90deg);
      }
    }
  </style>
</head>
<body>
  <div class="background"></div>
</body>
</html>
